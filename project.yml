# Generate the Xcode project with:  xcodegen generate
name: MouseControl
options:
  bundleIdPrefix: com.seanking
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  MouseControlKit:
    path: Packages/MouseControlKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: MDMNS9Q8F5
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES

targets:
  MouseControl:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MouseControlKit
    entitlements:
      path: App/MouseControl.entitlements
      properties: {}  # no sandbox, no network: Hardened Runtime only
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MouseControl
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "27.0"
        NSHumanReadableCopyright: "© 2026 Sean King"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanking.MouseControl
        PRODUCT_NAME: MouseControl
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - package: MouseControlKit/MouseControlKitTests
